<div class="container mt-4">
  <form [formGroup]="registerForm" novalidate>
    <h2 class="mb-3">Register</h2>

    <!-- Username -->
    <div class="mb-3">
      <label>Username</label>
      <input type="text" formControlName="username" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f?.['username']?.errors }" />
      <div *ngIf="submitted && f?.['username']?.errors" class="invalid-feedback">
        <div *ngIf="f?.['username']?.errors?.['required']">Username is required</div>
        <div *ngIf="f?.['username']?.errors?.['minlength']">At least 3 characters</div>
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label>Email</label>
      <input type="email" formControlName="email" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f?.['email']?.errors }" />
      <div *ngIf="submitted && f?.['email']?.errors" class="invalid-feedback">
        <div *ngIf="f?.['email']?.errors?.['required']">Email is required</div>
        <div *ngIf="f?.['email']?.errors?.['email']">Invalid email</div>
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label>Password</label>
      <input type="password" formControlName="password" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f?.['password']?.errors }" />
      <div *ngIf="submitted && f?.['password']?.errors" class="invalid-feedback">
        <div *ngIf="f?.['password']?.errors?.['required']">Password is required</div>
        <div *ngIf="f?.['password']?.errors?.['minlength']">At least 6 characters</div>
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="mb-3">
      <label>Confirm Password</label>
      <input type="password" formControlName="confirmPassword" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && registerForm.errors?.['passwordMismatch'] }" />
      <div *ngIf="submitted && registerForm.errors?.['passwordMismatch']" class="invalid-feedback">
        Passwords do not match
      </div>
    </div>

    <!-- Submit Button -->
    <lda-storybook-button [primary]="false" [icon]="true" [size]="'medium'" [label]="'Register'" (onClick)="onRegister()"></lda-storybook-button>
  </form>
</div>
